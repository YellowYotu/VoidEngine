name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path package/ui | Out-Null
          Copy-Item build/Release/VoidEngine.exe package/VoidEngine.exe
          Copy-Item ui/* package/ui/ -Recurse -Force
          Compress-Archive -Path package/* -DestinationPath "VoidEngine-$version.zip" -Force

      - name: Upload engine package
        uses: actions/upload-artifact@v4
        with:
          name: VoidEngine-${{ steps.version.outputs.version }}
          path: VoidEngine-${{ steps.version.outputs.version }}.zip
